[workspace]
members = ["crates/core", "crates/server"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
mini-router-core = { path = "crates/core" }

axum = "0.8.9"
jsonschema = "0.59.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread", "net"] }
toml = "1.1.8"
urlencoding = "2.1.3"

tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"
