[package]
name = "mini-router"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
jsonschema = "0.59.0"
reqwest = { version = "0.13.5", features = ["json", "query"] }
rust_decimal = { version = "1.43.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["macros", "rt-multi-thread"] }
toml = "1.1.8"
urlencoding = "2.1.3"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
