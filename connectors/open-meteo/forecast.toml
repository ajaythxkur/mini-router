# connectors/open-meteo/forecast.toml
id = "open-meteo#forecast"
display_name = "Open-Meteo Forecast"
description = "Hourly/daily weather forecast for a lat/lon. No key needed. For city names, call nominatim#search first."
categories = ["weather"]

[request]
method = "GET"
base_url = "https://api.open-meteo.com"
path = "/v1/forecast"

[pricing]
kind = "per_call"
amount = "0.001"

[input]   # JSON Schema for query params
type = "object"
required = ["latitude", "longitude"]
additionalProperties = false
properties.latitude = { type = "number", minimum = -90, maximum = 90 }
properties.longitude = { type = "number", minimum = -180, maximum = 180 }
properties.current = { type = "string", description = "Comma-separated current variables, e.g. temperature_2m,wind_speed_10m" }
properties.hourly = { type = "string", description = "Comma-separated hourly variables, e.g. temperature_2m,precipitation" }
properties.forecast_days = { type = "integer", minimum = 1, maximum = 16 }
