id = "dictionary#define"
display_name = "Dictionary Definition"
description = "English word definitions, phonetics, pronunciations and usage examples (Free Dictionary API). Free, no key. Returns 404 for words it doesn't know."
categories = ["dictionary", "language", "education"]

[request]
method = "GET"
base_url = "https://api.dictionaryapi.dev"
path = "/api/v2/entries/en/{word}"

[pricing]
kind = "per_call"
amount = "0.001"

[input]
type = "object"
required = ["word"]
additionalProperties = false
properties.word = { type = "string", minLength = 1, description = "English word to look up, e.g. hello." }
