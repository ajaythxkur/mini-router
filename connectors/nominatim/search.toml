id = "nominatim#search"
display_name = "Nominatim Geocoding"
description = "Turn a place name or address into latitude/longitude (OpenStreetMap). Free, no key; max 1 request/second. Use before open-meteo#forecast when you only have a city name."
categories = ["geocoding", "maps"]

[request]
method = "GET"
base_url = "https://nominatim.openstreetmap.org"
path = "/search?format=json"

[pricing]
kind = "per_call"
amount = "0.001"

[input]
type = "object"
required = ["q"]
additionalProperties = false
properties.q = { type = "string", minLength = 1, description = "Place name or address, e.g. 'Delhi'" }
properties.limit = { type = "integer", minimum = 1, maximum = 40, description = "Maximum number of places to return (default 10)." }
