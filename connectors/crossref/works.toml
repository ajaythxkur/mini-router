id = "crossref#works"
display_name = "Crossref Works Search"
description = "Search scholarly publications and bibliographic metadata, including titles, authors, DOIs, journals, and publication dates."
categories = ["research", "academic", "search"]

[request]
method = "GET"
base_url = "https://api.crossref.org"
path = "/works"

[pricing]
kind = "per_call"
amount = "0.001"

[input]
type = "object"
required = ["query"]
additionalProperties = false
properties.query = { type = "string", minLength = 1, description = "Search terms for scholarly works, e.g. Rust memory safety." }
properties.rows = { type = "integer", minimum = 1, maximum = 100, description = "Maximum number of matching works to return." }
